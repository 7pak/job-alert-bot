[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-alert-bot"
version = "0.1.0"
description = "Self-hosted instant job alerts on Telegram for any role and country. It never applies for you."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["job-alerts", "job-search", "telegram-bot", "greenhouse", "lever", "ashby", "self-hosted"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",   # timezone names on Windows and slim containers
]

[project.optional-dependencies]
claude = ["anthropic>=1.0"]
docx = ["python-docx>=1.1"]
dev = ["ruff>=0.6"]

[project.scripts]
jobbot = "jobbot.__main__:main"

[tool.setuptools.packages.find]
include = ["jobbot*"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E731"]   # small named lambdas are fine here

[tool.ruff.lint.isort]
known-first-party = ["jobbot", "tests"]

[tool.ruff.lint.per-file-ignores]
"jobbot/tailor.py" = ["E501"]   # the prompt text reads better unwrapped
